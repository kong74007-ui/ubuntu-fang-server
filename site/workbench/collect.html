<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采集拆解 · 黄雀 AI 工作台</title>
<link rel="icon" href="../assets/cloud/logo-bird.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/cloud.css?v=8">
<style>
  body { overflow: hidden; }
  .gCollect { grid-template-columns: 1.1fr 1fr; }
  @media (max-width: 1100px) { .gCollect { grid-template-columns: 1fr; } }
  @keyframes hq-spin { to { transform: rotate(360deg); } }
  .want-chip { padding: 7px 14px; font-size: 12.5px; border-radius: 8px; cursor: pointer; transition: .16s; user-select: none; }
  .sr-card { border: 1px solid rgba(148,164,187,.14); border-radius: 11px; overflow: hidden; cursor: pointer; transition: .16s; background: rgba(148,164,187,.03); }
  .sr-card:hover { border-color: rgba(231,178,76,.3); background: rgba(231,178,76,.05); }
  .sr-card.selected { border-color: rgba(231,178,76,.5); background: rgba(231,178,76,.08); }
  .cmt-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(148,164,187,.08); }
  .cmt-item:last-child { border-bottom: none; }
  .copy-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; font-size: 11.5px; color: #94a4bb; background: rgba(148,164,187,.06); border: 1px solid rgba(148,164,187,.14); border-radius: 6px; cursor: pointer; transition: .16s; font-family: inherit; }
  .copy-btn:hover { color: #e7b24c; border-color: rgba(231,178,76,.3); background: rgba(231,178,76,.08); }
</style>
</head>
<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>

<div class="hq-app"><div class="hq-content" data-active="collect">
  <div class="gCollect" style="display:grid; gap:18px; align-items:start;">

    <!-- ===== LEFT: Controls ===== -->
    <div style="border:1px solid rgba(148,164,187,.1); border-radius:18px; background:linear-gradient(165deg, rgba(16,24,39,.58), rgba(12,18,32,.46)); padding:22px;">
      <div>
        <h1 style="margin:0; font-size:21px; font-weight:700;">采集拆解</h1>
        <p style="margin:7px 0 0; font-size:13px; color:#94a4bb;">一键拆解视频文案、评论、口播，沉淀可复用的内容素材</p>
      </div>

      <!-- Platform tabs -->
      <div style="font-size:13.5px; font-weight:600; margin:22px 0 10px;">平台</div>
      <div id="platformRow" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
        <div class="hv-gold" data-plat="douyin" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32); transition:.16s;">抖音</div>
        <div class="hv-gold" data-plat="xhs" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s;">小红书</div>
        <div class="hv-gold" data-plat="channels" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s;">视频号</div>
      </div>

      <!-- Mode toggle -->
      <div style="display:flex; gap:0; margin:22px 0 16px; border:1px solid rgba(148,164,187,.14); border-radius:11px; padding:3px; background:rgba(7,11,19,.3);">
        <button id="tabLink" style="flex:1; padding:9px; font-size:13px; font-weight:500; border:none; border-radius:9px; cursor:pointer; font-family:inherit; transition:.16s; color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c);">贴链接</button>
        <button id="tabKw" style="flex:1; padding:9px; font-size:13px; font-weight:500; border:none; border-radius:9px; cursor:pointer; font-family:inherit; transition:.16s; color:#94a4bb; background:transparent;">关键词搜</button>
      </div>

      <!-- Link mode -->
      <div id="linkMode">
        <div style="font-size:13.5px; font-weight:600; margin-bottom:9px;">分享链接</div>
        <div style="position:relative; border:1px solid rgba(148,164,187,.16); background:rgba(7,11,19,.5); border-radius:12px; padding:14px 15px;">
          <textarea id="urlInput" rows="3" placeholder="粘贴抖音 / 小红书 / 视频号分享链接，支持 App 复制的带文字短链…" style="width:100%; resize:none; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:13.5px; line-height:1.7; font-family:inherit;"></textarea>
          <div style="display:flex; align-items:center; justify-content:flex-end; margin-top:4px;">
            <span id="urlClear" class="hv-gold" style="font-size:11.5px; color:#5c6b82; cursor:pointer; transition:.16s;">清空</span>
          </div>
        </div>
      </div>

      <!-- Keyword mode -->
      <div id="kwMode" style="display:none;">
        <div style="font-size:13.5px; font-weight:600; margin-bottom:9px;">关键词</div>
        <div style="display:flex; gap:8px;">
          <input id="kwInput" placeholder="输入关键词，如：美甲 最新款" style="flex:1; background:rgba(7,11,19,.5); border:1px solid rgba(148,164,187,.16); border-radius:11px; padding:11px 14px; color:#eaf1fa; font-size:13.5px; outline:none; font-family:inherit; transition:.16s;">
          <button id="kwSearch" class="hv-lift" style="padding:11px 18px; font-size:13px; font-weight:600; color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c); border:none; border-radius:11px; cursor:pointer; font-family:inherit; white-space:nowrap;">搜索</button>
        </div>
        <div style="font-size:11.5px; color:#5c6b82; margin-top:7px;">搜索消耗 <span style="color:#e7b24c; font-family:'JetBrains Mono',monospace;">1</span> 点</div>
        <div id="searchResults" style="display:none; margin-top:14px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
            <span style="font-size:13px; font-weight:500; color:#94a4bb;">搜索结果</span>
            <span id="srCount" style="font-size:12px; color:#e7b24c; font-family:'JetBrains Mono',monospace;"></span>
          </div>
          <div id="srGrid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:8px; max-height:400px; overflow-y:auto; padding-right:2px;"></div>
        </div>
        <div id="kwSelected" style="display:none; margin-top:12px; padding:11px 14px; border:1px solid rgba(231,178,76,.28); border-radius:11px; background:rgba(231,178,76,.06);">
          <div style="font-size:11.5px; color:#94a4bb; margin-bottom:4px;">已选视频</div>
          <div id="kwSelectedTitle" style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#eaf1fa;"></div>
        </div>
      </div>

      <!-- Want options -->
      <div style="font-size:13.5px; font-weight:600; margin:22px 0 10px;">采集内容</div>
      <div id="wantRow" style="display:flex; flex-wrap:wrap; gap:8px;">
        <div class="want-chip" data-want="copy" data-on="1" style="color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32);">文案</div>
        <div class="want-chip" data-want="comments" data-on="1" style="color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32);">评论区</div>
        <div class="want-chip" data-want="transcript" data-on="1" style="color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32);">口播文案</div>
      </div>

      <button id="colBtn" class="hv-lift" style="width:100%; height:54px; margin-top:22px; font-size:16px; font-weight:700; color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c); border:none; border-radius:14px; cursor:pointer; box-shadow:0 14px 34px -12px rgba(231,178,76,.7); transition:.2s; font-family:inherit;">采集（约 5 点）</button>
      <div id="colNote" style="text-align:center; font-size:11.5px; color:#5c6b82; margin-top:11px;">本次预计消耗约 <span style="color:#e7b24c; font-family:'JetBrains Mono',monospace;">5</span> 点 · 失败自动退点</div>
    </div>

    <!-- ===== RIGHT: Results + History ===== -->
    <div style="border:1px solid rgba(231,178,76,.16); border-radius:18px; background:linear-gradient(165deg, rgba(20,17,10,.6), rgba(12,16,26,.5)); padding:20px;">
      <div style="font-size:16px; font-weight:600; margin-bottom:14px;">采集结果</div>

      <!-- Empty state -->
      <div id="emptyState" style="border:1px solid rgba(148,164,187,.1); border-radius:14px; background:rgba(7,11,19,.3);">
        <div style="padding:52px 20px; text-align:center;">
          <div style="display:flex; justify-content:center; margin-bottom:14px; color:rgba(148,164,187,.25);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:48px; height:48px;"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
          </div>
          <div style="font-size:14px; color:#5c6b82; font-weight:500;">粘贴视频链接开始采集</div>
          <div style="font-size:12px; color:#3d4f62; margin-top:6px;">或切换「关键词搜」找到目标视频后点采集</div>
        </div>
      </div>

      <!-- Loading state -->
      <div id="loadingState" style="display:none; border:1px solid rgba(45,212,191,.2); border-radius:14px; background:rgba(7,11,19,.3);">
        <div style="padding:52px 20px; text-align:center;">
          <div style="display:flex; justify-content:center; margin-bottom:16px; color:#2dd4bf; animation:hq-spin 1.2s linear infinite;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:36px; height:36px;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </div>
          <div id="loadingNote" style="font-size:13.5px; color:#2dd4bf; font-weight:500;"></div>
          <div style="font-size:11.5px; color:#5c6b82; margin-top:8px;">可切到其他页，回来自动接上</div>
        </div>
      </div>

      <!-- Result state -->
      <div id="resultState" style="display:none;">
        <!-- Video card -->
        <div style="border:1px solid rgba(148,164,187,.1); border-radius:14px; overflow:hidden; margin-bottom:12px; background:rgba(7,11,19,.4);">
          <div style="display:flex;">
            <img id="vcCover" src="" alt="封面" style="width:90px; flex:none; object-fit:cover; aspect-ratio:9/16; border-right:1px solid rgba(148,164,187,.1); background:rgba(148,164,187,.06);">
            <div style="padding:14px 16px; flex:1; min-width:0;">
              <div id="vcTitle" style="font-size:14px; font-weight:600; line-height:1.5; margin-bottom:8px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;"></div>
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                <img id="vcAvatar" src="" alt="" style="width:20px; height:20px; border-radius:50%; object-fit:cover; background:rgba(148,164,187,.2);">
                <span id="vcAuthor" style="font-size:12.5px; color:#94a4bb;"></span>
              </div>
              <div id="vcStats" style="display:flex; gap:12px; flex-wrap:wrap;"></div>
              <div id="vcMeta" style="font-size:11px; color:#5c6b82; margin-top:8px; font-family:'JetBrains Mono',monospace;"></div>
            </div>
          </div>
        </div>

        <!-- Copy block -->
        <div id="copyBlock" style="border:1px solid rgba(148,164,187,.1); border-radius:14px; padding:14px 16px; margin-bottom:10px; background:rgba(7,11,19,.3);">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <span style="font-size:13.5px; font-weight:600;">文案</span>
            <button class="copy-btn" id="copyAllBtn">复制全部</button>
          </div>
          <div id="copyContent"></div>
        </div>

        <!-- Transcript block -->
        <div id="transcriptBlock" style="border:1px solid rgba(148,164,187,.1); border-radius:14px; padding:14px 16px; margin-bottom:10px; background:rgba(7,11,19,.3);">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <span style="font-size:13.5px; font-weight:600;">口播文案</span>
            <button class="copy-btn" id="copyTranscriptBtn" style="display:none;">复制</button>
          </div>
          <div id="transcriptText" style="font-size:13px; line-height:1.8; color:#5c6b82;"></div>
        </div>

        <!-- Comments block -->
        <div style="border:1px solid rgba(148,164,187,.1); border-radius:14px; padding:14px 16px; background:rgba(7,11,19,.3);">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <span style="font-size:13.5px; font-weight:600;">评论区 <span id="cmtCount" style="font-size:12px; color:#5c6b82; font-weight:400;"></span></span>
            <button class="copy-btn" id="exportCmtBtn">导出评论</button>
          </div>
          <div id="cmtList"></div>
          <div id="cmtMore" style="display:none; font-size:12px; color:#5c6b82; text-align:center; padding:8px 0; margin-top:8px; border-top:1px solid rgba(148,164,187,.08);">仅展示部分评论，导出可获取更多</div>
        </div>
      </div>

      <!-- Action buttons row -->
      <div id="actRow" style="display:grid; grid-template-columns:repeat(6,1fr); gap:7px; margin-top:14px;">
        <div id="actCopy" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;">
          <span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
          <span style="font-size:11px; color:#94a4bb;">复制文案</span>
        </div>
        <div id="actExport" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;">
          <span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span>
          <span style="font-size:11px; color:#94a4bb;">导出评论</span>
        </div>
        <div id="actBanana" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;">
          <span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span>
          <span style="font-size:11px; color:#94a4bb;">转作图</span>
        </div>
        <div id="actFeishu" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;">
          <span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></span>
          <span style="font-size:11px; color:#94a4bb;">发飞书</span>
        </div>
        <div id="actStore" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;">
          <span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14h6"/></svg></span>
          <span style="font-size:11px; color:#94a4bb;">入库</span>
        </div>
        <div id="actRetry" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;">
          <span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg></span>
          <span style="font-size:11px; color:#94a4bb;">再采集</span>
        </div>
      </div>

      <!-- History -->
      <div style="display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;">
        <span style="font-size:15px; font-weight:600;">最近采集</span>
        <a href="assets.html" style="display:flex; align-items:center; gap:4px; font-size:12.5px; color:#94a4bb; cursor:pointer; text-decoration:none;">全部 <span style="display:flex; width:12px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M9 18l6-6-6-6"/></svg></span></a>
      </div>
      <div id="collectHistory" style="display:grid; grid-template-columns:repeat(3,1fr); gap:9px;">
        <div style="grid-column:1/-1; padding:18px 0; text-align:center; font-size:12.5px; color:#5c6b82;">还没有采集记录</div>
      </div>
    </div>

  </div>
</div></div>

<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=10"></script>
<script>
(function () {
  'use strict';

  /* ---- state ---- */
  var platform = 'douyin';
  var mode = 'link';       // 'link' | 'keyword'
  var selectedUrl = '';    // set when user picks from search grid
  var currentResult = null;
  var copyFields = {};     // field key → text, used by copy buttons
  var pollIv = null;

  function tok() { return localStorage.getItem('hq_token') || ''; }

  /* ---- note helper ---- */
  function setNote(html, color) {
    var n = document.getElementById('colNote');
    if (!n) return;
    n.innerHTML = html;
    n.style.color = color || '#5c6b82';
  }

  /* ---- busy state ---- */
  var colBtn = document.getElementById('colBtn');
  var origBtnText = colBtn ? colBtn.textContent : '采集';
  function busy(on) {
    if (!colBtn) return;
    colBtn.style.pointerEvents = on ? 'none' : 'auto';
    colBtn.style.opacity = on ? '.7' : '1';
    colBtn.textContent = on ? '采集中…' : origBtnText;
  }

  /* ---- panel switcher ---- */
  function showState(which) {
    ['emptyState', 'loadingState', 'resultState'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = id === which ? '' : 'none';
    });
  }
  function setLoadNote(t) {
    var el = document.getElementById('loadingNote');
    if (el) el.textContent = t;
  }

  /* ---- platform tabs ---- */
  document.querySelectorAll('#platformRow > div').forEach(function (c) {
    c.onclick = function () {
      document.querySelectorAll('#platformRow > div').forEach(function (x) {
        x.style.color = '#94a4bb';
        x.style.background = 'rgba(148,164,187,.05)';
        x.style.borderColor = 'rgba(148,164,187,.14)';
      });
      c.style.color = '#e7b24c';
      c.style.background = 'rgba(231,178,76,.1)';
      c.style.borderColor = 'rgba(231,178,76,.32)';
      platform = c.getAttribute('data-plat');
    };
  });

  /* ---- mode toggle ---- */
  var tabLink = document.getElementById('tabLink');
  var tabKw   = document.getElementById('tabKw');
  var linkModeEl = document.getElementById('linkMode');
  var kwModeEl   = document.getElementById('kwMode');

  function setMode(m) {
    mode = m;
    var onCss  = 'color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c);';
    var offCss = 'color:#94a4bb; background:transparent;';
    tabLink.style.cssText = tabLink.style.cssText + (m === 'link' ? onCss : offCss);
    tabKw.style.cssText   = tabKw.style.cssText   + (m === 'keyword' ? onCss : offCss);
    // simpler: just swap the two properties
    tabLink.style.color      = m === 'link' ? '#1a1206' : '#94a4bb';
    tabLink.style.background = m === 'link' ? 'linear-gradient(135deg,#f4cd72,#e7b24c)' : 'transparent';
    tabKw.style.color        = m === 'keyword' ? '#1a1206' : '#94a4bb';
    tabKw.style.background   = m === 'keyword' ? 'linear-gradient(135deg,#f4cd72,#e7b24c)' : 'transparent';
    linkModeEl.style.display = m === 'link' ? '' : 'none';
    kwModeEl.style.display   = m === 'keyword' ? '' : 'none';
    selectedUrl = '';
  }
  tabLink.onclick = function () { setMode('link'); };
  tabKw.onclick   = function () { setMode('keyword'); };

  /* ---- URL clear ---- */
  var urlInput = document.getElementById('urlInput');
  var urlClear = document.getElementById('urlClear');
  if (urlClear) urlClear.onclick = function () { if (urlInput) urlInput.value = ''; };

  /* ---- want chips ---- */
  document.querySelectorAll('.want-chip').forEach(function (c) {
    c.onclick = function () {
      var on = c.getAttribute('data-on') === '1';
      c.setAttribute('data-on', on ? '0' : '1');
      c.style.color      = on ? '#94a4bb' : '#e7b24c';
      c.style.background = on ? 'rgba(148,164,187,.05)' : 'rgba(231,178,76,.1)';
      c.style.borderColor = on ? 'rgba(148,164,187,.14)' : 'rgba(231,178,76,.32)';
    };
  });

  function getWant() {
    var w = [];
    document.querySelectorAll('.want-chip').forEach(function (c) {
      if (c.getAttribute('data-on') === '1') w.push(c.getAttribute('data-want'));
    });
    return w.length ? w : ['copy'];
  }

  /* ---- keyword search ---- */
  var kwSearch  = document.getElementById('kwSearch');
  var kwInput   = document.getElementById('kwInput');
  var srResults = document.getElementById('searchResults');
  var srGrid    = document.getElementById('srGrid');
  var srCount   = document.getElementById('srCount');
  var kwSelected      = document.getElementById('kwSelected');
  var kwSelectedTitle = document.getElementById('kwSelectedTitle');

  if (kwSearch) kwSearch.onclick = doSearch;
  if (kwInput)  kwInput.onkeydown = function (e) { if (e.key === 'Enter') doSearch(); };

  function doSearch() {
    var kw = kwInput ? kwInput.value.trim() : '';
    if (!kw) return;
    if (!tok()) { location.href = '../login.html?redirect=collect'; return; }
    kwSearch.textContent = '搜索中…';
    kwSearch.style.opacity = '.7';
    kwSearch.style.pointerEvents = 'none';
    fetch('/api/gen/collect/search?platform=' + platform + '&keyword=' + encodeURIComponent(kw) + '&page=1', {
      headers: { 'Authorization': 'Bearer ' + tok() }
    })
    .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
    .then(function (x) {
      kwSearch.textContent = '搜索';
      kwSearch.style.opacity = '1';
      kwSearch.style.pointerEvents = 'auto';
      if (x.s === 401) { location.href = '../login.html?redirect=collect'; return; }
      if (x.s === 402) { setNote('点数不足 · <a href="recharge.html" style="color:#e7b24c">去充值</a>', '#f4708a'); return; }
      renderSearchResults((x.d && x.d.items) || []);
      if (x.d && x.d.points_left != null && window.HQ) window.HQ.refreshPoints();
    })
    .catch(function () {
      kwSearch.textContent = '搜索';
      kwSearch.style.opacity = '1';
      kwSearch.style.pointerEvents = 'auto';
      setNote('搜索失败，请重试', '#f4708a');
    });
  }

  function renderSearchResults(items) {
    if (!srGrid) return;
    srResults.style.display = '';
    if (!items.length) {
      srCount.textContent = '无结果';
      srGrid.innerHTML = '<div style="grid-column:1/-1; padding:18px; text-align:center; font-size:12.5px; color:#5c6b82;">未找到相关视频</div>';
      return;
    }
    srCount.textContent = items.length + ' 条';
    srGrid.innerHTML = items.map(function (it, i) {
      var likes = it.stats && it.stats.like != null ? fmtNum(it.stats.like) : '';
      return '<div class="sr-card" data-idx="' + i + '">' +
        '<div style="position:relative; aspect-ratio:9/16; overflow:hidden; background:rgba(7,11,19,.5);">' +
          '<img src="' + esc(it.cover || '') + '" alt="" style="width:100%; height:100%; object-fit:cover;" onerror="this.style.display=\'none\'">' +
          (likes ? '<div style="position:absolute; bottom:5px; left:5px; padding:2px 7px; background:rgba(7,11,19,.65); border-radius:5px; font-size:10.5px; color:#eaf1fa; font-family:\'JetBrains Mono\',monospace;">♥ ' + likes + '</div>' : '') +
        '</div>' +
        '<div style="padding:7px 9px 9px;">' +
          '<div style="font-size:12px; font-weight:500; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.5; margin-bottom:4px;">' + escHtml(it.title || '无标题') + '</div>' +
          '<div style="font-size:11px; color:#5c6b82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">@' + escHtml(it.author || '') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // store items for click handler
    srGrid.querySelectorAll('.sr-card').forEach(function (card) {
      var idx = parseInt(card.getAttribute('data-idx'), 10);
      var it  = items[idx] || {};
      card.onclick = function () {
        srGrid.querySelectorAll('.sr-card').forEach(function (x) { x.classList.remove('selected'); });
        card.classList.add('selected');
        selectedUrl = it.url || '';
        if (kwSelected) kwSelected.style.display = '';
        if (kwSelectedTitle) kwSelectedTitle.textContent = it.title || selectedUrl;
      };
    });
  }

  /* ---- poll ---- */
  function poll(id, t0) {
    if (pollIv) clearInterval(pollIv);
    pollIv = setInterval(function () {
      fetch('/api/gen/job/' + id, { headers: { 'Authorization': 'Bearer ' + tok() } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var sec = Math.round((Date.now() - t0) / 1000);
          if (!d.status) {
            clearInterval(pollIv);
            busy(false); showState('emptyState');
            localStorage.removeItem('hq_active_collect_job');
            return;
          }
          if (d.status === 'done') {
            clearInterval(pollIv);
            busy(false);
            localStorage.removeItem('hq_active_collect_job');
            if (d.result) { currentResult = d.result; renderResult(d.result); }
            setNote('✅ 采集完成（' + sec + 's）· 点数已更新', '#2bd576');
            if (window.HQ && window.HQ.refreshPoints) window.HQ.refreshPoints();
            loadHistory();
          } else if (d.status === 'error') {
            clearInterval(pollIv);
            busy(false); showState('emptyState');
            setNote('采集失败：' + (d.error || '') + ' · 已退点', '#f4708a');
            localStorage.removeItem('hq_active_collect_job');
          } else if (sec > 400) {
            clearInterval(pollIv);
            busy(false); showState('emptyState');
            setNote('采集超时（' + sec + 's）· 已自动退点，请重试', '#f4708a');
            localStorage.removeItem('hq_active_collect_job');
          } else {
            setLoadNote('采集中（' + sec + 's）');
          }
        }).catch(function () {});
    }, 4000);
  }

  /* ---- submit collect ---- */
  function submitCollect(url) {
    if (!url) { setNote('请粘贴视频链接或选择视频', '#f4708a'); return; }
    if (!tok()) { location.href = '../login.html?redirect=collect'; return; }
    busy(true);
    showState('loadingState');
    setLoadNote('提交采集任务…');
    var t0 = Date.now();
    fetch('/api/gen/collect', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + tok(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform: platform, url: url, want: getWant() })
    })
    .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
    .then(function (x) {
      if (x.s === 401) { location.href = '../login.html?redirect=collect'; return; }
      if (x.s === 402) {
        busy(false); showState('emptyState');
        setNote('点数不足 · <a href="recharge.html" style="color:#e7b24c">去充值</a>', '#f4708a');
        return;
      }
      if (!x.d || !x.d.job_id) {
        busy(false); showState('emptyState');
        setNote('提交失败：' + ((x.d && x.d.detail) || '未知'), '#f4708a');
        return;
      }
      localStorage.setItem('hq_active_collect_job', JSON.stringify({ id: x.d.job_id, t0: t0, url: url }));
      setLoadNote('采集任务已提交，正在处理…');
      poll(x.d.job_id, t0);
    })
    .catch(function () {
      busy(false); showState('emptyState');
      setNote('网络错误，请重试', '#f4708a');
    });
  }

  /* ---- collect button ---- */
  if (colBtn) colBtn.onclick = function () {
    var url = '';
    if (mode === 'link') {
      url = urlInput ? urlInput.value.trim() : '';
      var m = url.match(/https?:\/\/\S+/);
      if (m) url = m[0];
    } else {
      url = selectedUrl;
    }
    submitCollect(url);
  };

  /* ---- render result ---- */
  function renderResult(r) {
    showState('resultState');
    var v        = r.video || {};
    var copy     = r.copy  || {};
    var tr       = r.transcript || null;
    var comments = r.comments   || [];

    /* video card */
    var vcCover  = document.getElementById('vcCover');
    var vcTitle  = document.getElementById('vcTitle');
    var vcAvatar = document.getElementById('vcAvatar');
    var vcAuthor = document.getElementById('vcAuthor');
    var vcStats  = document.getElementById('vcStats');
    var vcMeta   = document.getElementById('vcMeta');

    if (vcCover)  { vcCover.src = v.cover || ''; }
    if (vcTitle)  vcTitle.textContent = v.title || '无标题';
    if (vcAvatar) { vcAvatar.src = v.authorAvatar || ''; vcAvatar.style.display = v.authorAvatar ? '' : 'none'; }
    if (vcAuthor) vcAuthor.textContent = '@' + (v.author || '');
    if (vcStats && v.stats) {
      var s = v.stats;
      vcStats.innerHTML = [
        s.like    != null ? statChip('♥', fmtNum(s.like),    '点赞') : '',
        s.comment != null ? statChip('💬', fmtNum(s.comment), '评论') : '',
        s.share   != null ? statChip('↗', fmtNum(s.share),   '分享') : '',
        s.collect != null ? statChip('★', fmtNum(s.collect), '收藏') : ''
      ].filter(Boolean).join('');
    }
    if (vcMeta) {
      var parts = [];
      if (v.duration)     parts.push(v.duration + 's');
      if (v.publish_time) parts.push(v.publish_time);
      vcMeta.textContent = parts.join(' · ');
    }

    /* copy block */
    copyFields = {};
    if (copy.title) copyFields.title = copy.title;
    if (copy.desc)  copyFields.desc  = copy.desc;
    if (copy.tags && copy.tags.length) copyFields.tags = copy.tags.map(function (t) { return '#' + t; }).join(' ');

    var copyContent = document.getElementById('copyContent');
    if (copyContent) {
      var html = '';
      if (copy.title) html += copyFieldHtml('标题', copy.title, 'title');
      if (copy.desc)  html += copyFieldHtml('正文', copy.desc,  'desc');
      if (copy.tags && copy.tags.length) {
        html += '<div style="margin-bottom:0;">' +
          '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">' +
            '<span style="font-size:12px; color:#5c6b82;">话题标签</span>' +
            '<button class="copy-btn copy-field-btn" data-field="tags">复制标签</button>' +
          '</div>' +
          '<div style="display:flex; flex-wrap:wrap; gap:6px;">' +
            copy.tags.map(function (t) {
              return '<span style="padding:4px 10px; background:rgba(45,212,191,.1); border:1px solid rgba(45,212,191,.2); border-radius:6px; font-size:12px; color:#2dd4bf;">#' + escHtml(t) + '</span>';
            }).join('') +
          '</div></div>';
      }
      if (!html) html = '<span style="font-size:13px; color:#5c6b82;">无文案数据</span>';
      copyContent.innerHTML = html;

      // bind copy-field buttons
      copyContent.querySelectorAll('.copy-field-btn').forEach(function (btn) {
        btn.onclick = function () {
          var text = copyFields[btn.getAttribute('data-field')] || '';
          copyText(text, btn);
        };
      });
    }

    /* copy all */
    var copyAllBtn = document.getElementById('copyAllBtn');
    if (copyAllBtn) copyAllBtn.onclick = function () {
      var all = [copy.title, copy.desc, copyFields.tags].filter(Boolean).join('\n\n');
      copyText(all, copyAllBtn);
    };

    /* transcript */
    var transcriptText      = document.getElementById('transcriptText');
    var copyTranscriptBtn   = document.getElementById('copyTranscriptBtn');
    if (transcriptText) {
      if (tr && tr.text) {
        transcriptText.style.color = '#eaf1fa';
        transcriptText.textContent = tr.text;
        if (copyTranscriptBtn) {
          copyTranscriptBtn.style.display = '';
          copyTranscriptBtn.onclick = function () { copyText(tr.text, copyTranscriptBtn); };
        }
      } else {
        transcriptText.style.color = '#5c6b82';
        transcriptText.innerHTML = '<span style="font-style:italic;">未提取 / 该视频无口播内容</span>';
        if (copyTranscriptBtn) copyTranscriptBtn.style.display = 'none';
      }
    }

    /* comments */
    var cmtList  = document.getElementById('cmtList');
    var cmtCount = document.getElementById('cmtCount');
    var cmtMore  = document.getElementById('cmtMore');
    if (cmtCount) cmtCount.textContent = '（' + comments.length + ' 条）';
    if (cmtList) {
      if (!comments.length) {
        cmtList.innerHTML = '<div style="padding:16px 0; text-align:center; font-size:12.5px; color:#5c6b82;">暂无评论数据</div>';
      } else {
        cmtList.innerHTML = comments.slice(0, 20).map(function (c) {
          var avatar = c.avatar
            ? '<img src="' + esc(c.avatar) + '" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;margin-top:1px;background:rgba(148,164,187,.2);" onerror="this.style.display=\'none\'">'
            : '<div style="width:28px;height:28px;border-radius:50%;flex:none;background:rgba(148,164,187,.15);display:flex;align-items:center;justify-content:center;font-size:11px;color:#5c6b82;">' + escHtml((c.user || '?').charAt(0)) + '</div>';
          return '<div class="cmt-item">' + avatar +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:12px;color:#94a4bb;margin-bottom:3px;display:flex;align-items:center;gap:8px;">' +
                '<span style="font-weight:500;">' + escHtml(c.user || '匿名') + '</span>' +
                (c.likes ? '<span style="font-size:11px;color:#5c6b82;font-family:\'JetBrains Mono\',monospace;">♥ ' + fmtNum(c.likes) + '</span>' : '') +
                (c.time  ? '<span style="font-size:11px;color:#3d4f62;">' + escHtml(c.time) + '</span>' : '') +
              '</div>' +
              '<div style="font-size:13px;line-height:1.6;color:#eaf1fa;">' + escHtml(c.text || '') + '</div>' +
            '</div></div>';
        }).join('');
      }
    }
    if (cmtMore) cmtMore.style.display = (r.comments_more || comments.length >= 20) ? '' : 'none';

    /* export button in block */
    var exportCmtBtn = document.getElementById('exportCmtBtn');
    if (exportCmtBtn) exportCmtBtn.onclick = function () { exportComments(comments, v.title); };
  }

  function copyFieldHtml(label, text, field) {
    return '<div style="margin-bottom:10px;">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">' +
        '<span style="font-size:12px;color:#5c6b82;">' + label + '</span>' +
        '<button class="copy-btn copy-field-btn" data-field="' + field + '">复制</button>' +
      '</div>' +
      '<div style="font-size:13px;line-height:1.7;color:#eaf1fa;white-space:pre-wrap;">' + escHtml(text) + '</div>' +
    '</div>';
  }

  function statChip(icon, val, label) {
    return '<div style="display:flex;align-items:center;gap:4px;font-size:12px;color:#94a4bb;">' +
      '<span>' + icon + '</span>' +
      '<span style="color:#eaf1fa;font-family:\'JetBrains Mono\',monospace;">' + val + '</span>' +
      '<span style="color:#5c6b82;">' + label + '</span>' +
    '</div>';
  }

  /* ---- copy helper ---- */
  function copyText(text, btn) {
    var origText = btn ? btn.textContent : '';
    function done() { if (btn) { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = origText; }, 1500); } }
    try {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } catch (e) { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
      done();
    }
  }

  /* ---- export comments ---- */
  function exportComments(comments, videoTitle) {
    if (!comments || !comments.length) { setNote('没有评论数据可导出', '#f4708a'); return; }
    var rows = ['序号,用户,点赞,时间,内容'];
    comments.forEach(function (c, i) {
      rows.push([i + 1, c.user || '', c.likes || 0, c.time || '', '"' + (c.text || '').replace(/"/g, '""') + '"'].join(','));
    });
    var head = '﻿'; // BOM for Excel
    var blob = new Blob([head + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'comments_' + Date.now() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    setNote('✅ 评论已导出 .csv', '#2bd576');
  }

  /* ---- action buttons ---- */
  var actCopy   = document.getElementById('actCopy');
  var actExport = document.getElementById('actExport');
  var actBanana = document.getElementById('actBanana');
  var actFeishu = document.getElementById('actFeishu');
  var actStore  = document.getElementById('actStore');
  var actRetry  = document.getElementById('actRetry');

  if (actCopy) actCopy.onclick = function () {
    if (!currentResult) { setNote('先采集一条视频', '#f4708a'); return; }
    var c = currentResult.copy || {};
    var all = [c.title, c.desc, copyFields.tags].filter(Boolean).join('\n\n');
    copyText(all, null);
    setNote('✅ 文案已复制到剪贴板', '#2bd576');
  };
  if (actExport) actExport.onclick = function () {
    if (!currentResult) { setNote('先采集一条视频', '#f4708a'); return; }
    exportComments(currentResult.comments, currentResult.video && currentResult.video.title);
  };
  if (actBanana) actBanana.onclick = function () {
    if (!currentResult || !currentResult.video) { setNote('先采集一条视频', '#f4708a'); return; }
    // ponytail: localStorage handoff — banana.html 侧加 hq_collect_to_banana 读取逻辑即可
    try {
      localStorage.setItem('hq_collect_to_banana', JSON.stringify({
        cover: currentResult.video.cover,
        title: (currentResult.copy && currentResult.copy.title) || currentResult.video.title
      }));
    } catch (e) {}
    location.href = 'banana.html';
  };
  if (actFeishu) actFeishu.onclick = function () {
    // TODO: 接入 /api/gen/... 飞书推送（bot 接入阶段）
    setNote('飞书推送即将上线（bot 接入阶段）', '#f4cd72');
  };
  if (actStore) actStore.onclick = function () {
    if (!currentResult) { setNote('先采集一条视频', '#f4708a'); return; }
    setNote('✅ 采集即自动入库 · <a href="assets.html" style="color:#e7b24c">去「资产」查看</a>', '#2bd576');
  };
  if (actRetry) actRetry.onclick = function () {
    var url = mode === 'link'
      ? (urlInput ? urlInput.value.trim() : '')
      : selectedUrl;
    var m = url.match(/https?:\/\/\S+/);
    if (m) url = m[0];
    submitCollect(url);
  };

  /* ---- history ---- */
  function loadHistory() {
    var grid = document.getElementById('collectHistory');
    if (!grid || !tok()) return;
    fetch('/api/gen/history?kind=collect', { headers: { 'Authorization': 'Bearer ' + tok() } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.items || !d.items.length) return;
        grid.innerHTML = d.items.slice(0, 6).map(function (it) {
          return '<div class="hv-lift" data-jid="' + esc(it.job_id || '') + '" style="cursor:pointer; border:1px solid rgba(148,164,187,.12); border-radius:11px; overflow:hidden; background:rgba(7,11,19,.4); transition:.16s;">' +
            '<img src="' + esc(it.url || '') + '" alt="" style="display:block; width:100%; aspect-ratio:9/16; object-fit:cover;" onerror="this.parentElement.style.background=\'rgba(148,164,187,.06)\'">' +
            '<div style="padding:6px 8px; font-size:11.5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#94a4bb;">' + escHtml(it.prompt || '') + '</div>' +
          '</div>';
        }).join('');
        grid.querySelectorAll('[data-jid]').forEach(function (card) {
          card.onclick = function () {
            var jid = card.getAttribute('data-jid');
            if (!jid) return;
            fetch('/api/gen/job/' + jid, { headers: { 'Authorization': 'Bearer ' + tok() } })
              .then(function (r) { return r.json(); })
              .then(function (d) {
                if (d.result) { currentResult = d.result; renderResult(d.result); setNote('已载入历史采集', '#2dd4bf'); }
              }).catch(function () {});
          };
        });
      }).catch(function () {});
  }

  /* ---- utils ---- */
  function fmtNum(n) {
    if (n == null || isNaN(n)) return '';
    n = Number(n);
    return n >= 10000 ? (n / 10000).toFixed(1) + 'w' : String(n);
  }
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function esc(s) { return String(s).replace(/"/g, '&quot;'); }

  /* ---- init ---- */
  loadHistory();

  // resume pending job
  try {
    var aj = JSON.parse(localStorage.getItem('hq_active_collect_job') || 'null');
    if (aj && aj.id) {
      busy(true);
      showState('loadingState');
      setLoadNote('接上进行中的采集任务…');
      if (aj.url && urlInput) urlInput.value = aj.url;
      poll(aj.id, aj.t0 || Date.now());
    }
  } catch (e) {}

})();
</script>
</body>
</html>
