      res=document.getElementById('bResult'), note=document.getElementById('bNote');
  if(!gen) return;
  var ratio='9:16', orig=gen.textContent;
  document.querySelectorAll('#ratioRow > div').forEach(function(c){ c.onclick=function(){
    document.querySelectorAll('#ratioRow > div').forEach(function(x){ x.style.color='#94a4bb'; x.style.background='rgba(148,164,187,.05)'; x.style.borderColor='rgba(148,164,187,.14)'; });

    var m=c.textContent.match(/\d+:\d+/); if(m) ratio=m[0];
  };});
  function tok(){ return localStorage.getItem('hq_token')||''; }
  function setNote(t,c){ note.innerHTML=t; note.style.color=c||'#5c6b82'; }
  function reset(){ gen.textContent=orig; gen.style.pointerEvents='auto'; gen.style.opacity='1'; res.style.filter='none'; }
  gen.onclick=function(){
    var prompt=(pr.value||'').trim();
    if(!prompt){ setNote('请先输入提示词','#f4708a'); return; }
    if(!tok()){ location.href='../login.html?redirect=banana'; return; }
    gen.textContent='生成中…'; gen.style.pointerEvents='none'; gen.style.opacity='.7'; res.style.filter='blur(3px) brightness(.6)';
    setNote('正在生成 · gpt-image-2 高清出图约 1-2 分钟','#2dd4bf');
    var t0=Date.now();
    fetch('/api/gen/image',{method:'POST',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,ratio:ratio})})
      .then(function(r){ return r.json().then(function(d){ return {s:r.status,d:d}; }); })
      .then(function(x){
        if(x.s===401){ location.href='../login.html?redirect=banana'; return; }
        if(x.s===402){ reset(); setNote('点数不足 · <a href="recharge.html" style="color:#e7b24c">去充值</a>','#f4708a'); return; }
        if(!x.d.job_id){ reset(); setNote('提交失败：'+((x.d&&x.d.detail)||'未知'),'#f4708a'); return; }
        (function poll(id){ var iv=setInterval(function(){
          fetch('/api/gen/job/'+id).then(function(r){return r.json();}).then(function(d){
            var sec=Math.round((Date.now()-t0)/1000);
            if(d.status==='done'){ clearInterval(iv); res.src=d.result.url+'?t='+Date.now(); reset(); setNote('✅ 出图完成（'+sec+'s）· 剩余点数已更新','#2bd576'); }
            else if(d.status==='error'){ clearInterval(iv); reset(); setNote('失败：'+(d.error||'')+' · 已退点','#f4708a'); }
            else setNote('生成中…（'+sec+'s）','#2dd4bf');
          }).catch(function(){});
        },4000); })(x.d.job_id);
      }).catch(function(){ reset(); setNote('网络错误，请重试','#f4708a'); });
  };
})();
</script>
