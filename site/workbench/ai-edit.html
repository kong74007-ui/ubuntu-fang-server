<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一键剪辑 · 黄雀 AI 工作台</title>

<link rel="stylesheet" href="../assets/cloud.css?v=8">

<style>
  body{overflow:hidden}
  .edit-page{height:100%;overflow:auto;padding:0 2px 30px}
  .edit-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:18px}
  .edit-hero h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
  .edit-hero p{margin:8px 0 0;color:#94a4bb;font-size:13px}
  .edit-badge{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid rgba(231,178,76,.24);border-radius:999px;background:rgba(231,178,76,.08);color:#e7b24c;font-size:12px;white-space:nowrap}
  .edit-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:16px;align-items:start}
  .panel{border:1px solid rgba(148,164,187,.12);border-radius:16px;background:linear-gradient(165deg,rgba(16,24,39,.62),rgba(10,15,25,.5));padding:20px}
  .panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .panel-title h2{margin:0;font-size:16px}.panel-title span{font-size:12px;color:#5c6b82}
  .asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-height:610px;overflow:auto;padding:2px}
  .asset-card{min-width:0;padding:0;border:1px solid rgba(148,164,187,.14);border-radius:14px;background:rgba(7,11,19,.42);color:#eaf1fa;cursor:pointer;text-align:left;font-family:inherit;overflow:hidden;transition:.18s}
  .asset-card:hover{transform:translateY(-2px);border-color:rgba(231,178,76,.34);background:rgba(231,178,76,.05)}
  .asset-card.on{border-color:rgba(231,178,76,.72);box-shadow:0 0 0 2px rgba(231,178,76,.1);background:rgba(231,178,76,.08)}
  .asset-cover{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,rgba(231,178,76,.2),transparent 42%),linear-gradient(145deg,#111a2a,#080c14);overflow:hidden}
  .asset-cover svg{width:38px;height:38px;color:#e7b24c;opacity:.9}.asset-duration{position:absolute;right:9px;bottom:8px;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.7);font:600 11px 'JetBrains Mono',monospace}
  .asset-check{position:absolute;left:9px;top:8px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#e7b24c;color:#1a1206;font-size:13px;font-weight:900;opacity:0;transform:scale(.75);transition:.16s}.asset-card.on .asset-check{opacity:1;transform:scale(1)}
  .asset-copy{padding:12px}.asset-name{font-size:13px;font-weight:650;line-height:1.5;height:39px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.asset-meta{margin-top:8px;display:flex;gap:7px;align-items:center;color:#5c6b82;font-size:11px}.asset-meta b{font-weight:500;color:#94a4bb}
  .state{padding:54px 20px;text-align:center;border:1px dashed rgba(148,164,187,.15);border-radius:14px;color:#5c6b82;font-size:13px}.state strong{display:block;color:#94a4bb;font-size:14px;margin-bottom:7px}
  .preview{position:relative;max-width:310px;margin:0 auto 16px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;border:1px solid rgba(231,178,76,.18);background:radial-gradient(circle at 50% 32%,rgba(231,178,76,.22),transparent 36%),#080c14;display:grid;place-items:center}
  .preview video{width:100%;height:100%;object-fit:cover;background:#05080d}.preview-empty{text-align:center;color:#5c6b82;font-size:12px}.preview-empty svg{display:block;width:48px;height:48px;margin:0 auto 12px;color:#e7b24c;opacity:.45}
  .preview-brand{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;pointer-events:none;font-size:9px;font-weight:800;letter-spacing:1px}.preview-brand span{padding:6px 8px;border-radius:999px;background:rgba(7,11,19,.66);border:1px solid rgba(255,255,255,.18)}
  .preview-card{position:absolute;left:14px;right:14px;bottom:20px;padding:13px;border-radius:13px;background:rgba(8,13,22,.86);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:700;line-height:1.55;pointer-events:none}
  .selected-info{padding:13px 14px;border:1px solid rgba(148,164,187,.12);border-radius:12px;background:rgba(7,11,19,.35);margin-bottom:12px}.selected-info b{display:block;font-size:13px;margin-bottom:5px}.selected-info span{font-size:11px;color:#5c6b82}
  .style-title{display:flex;align-items:center;justify-content:space-between;margin:14px 0 9px;font-size:13px;font-weight:700}.style-title span{color:#5c6b82;font-size:11px;font-weight:500}.style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.style-option{height:38px;padding:0 8px;border:1px solid rgba(148,164,187,.13);border-radius:9px;background:rgba(148,164,187,.035);color:#94a4bb;font:600 11px inherit;cursor:pointer;white-space:nowrap}.style-option:hover{border-color:rgba(231,178,76,.3);color:#eaf1fa}.style-option.on{border-color:rgba(231,178,76,.62);background:rgba(231,178,76,.09);color:#e7b24c}.style-option:disabled{cursor:not-allowed;opacity:.55}
  .feature-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 16px}.feature{padding:10px 5px;border:1px solid rgba(148,164,187,.11);border-radius:10px;text-align:center;color:#94a4bb;font-size:11px;background:rgba(148,164,187,.03)}.feature b{display:block;color:#e7b24c;font-size:12px;margin-bottom:3px}
  .generate{width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,#f4cd72,#e7b24c);color:#1a1206;font:800 16px inherit;cursor:pointer;box-shadow:0 14px 34px -12px rgba(231,178,76,.7);transition:.18s}.generate:hover:not(:disabled){transform:translateY(-1px)}.generate:disabled{cursor:not-allowed;filter:saturate(.25);opacity:.55;box-shadow:none}
  .cost{text-align:center;color:#5c6b82;font-size:12px;margin-top:10px}.cost b{color:#e7b24c;font-family:'JetBrains Mono',monospace}
  .progress{display:none;margin-top:14px;padding:14px;border-radius:12px;border:1px solid rgba(45,212,191,.18);background:rgba(45,212,191,.05)}.progress.show{display:block}.progress-top{display:flex;justify-content:space-between;font-size:12px;color:#2dd4bf}.progress-track{height:7px;margin-top:10px;border-radius:99px;background:rgba(148,164,187,.12);overflow:hidden}.progress-bar{height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,#2dd4bf,#e7b24c);transition:width .45s ease}
  .result-actions{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.result-actions.show{display:grid}.result-actions button,.result-actions a{height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;font:650 13px inherit;text-decoration:none;cursor:pointer}.secondary{border:1px solid rgba(148,164,187,.18);background:rgba(148,164,187,.05);color:#eaf1fa}.gold{border:1px solid rgba(231,178,76,.3);background:rgba(231,178,76,.1);color:#e7b24c}
  .toast{position:fixed;left:50%;bottom:30px;z-index:3000;transform:translate(-50%,18px);padding:10px 16px;border-radius:10px;background:#172131;color:#eaf1fa;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:1180px){.edit-layout{grid-template-columns:1fr}.asset-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:760px){.edit-hero{display:block}.edit-badge{margin-top:12px;width:max-content}.asset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}.feature-list{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="ai-edit">
  <main class="edit-page">
    <header class="edit-hero">
      <div><h1>✂️ 一键剪辑</h1><p>选择已经生成的数字化 IP 口播视频，自动包装为可直接发布的竖屏成片</p></div>
      <div class="edit-badge"><span>●</span> 测试版 · 1080 × 1920</div>
    </header>
    <div class="edit-layout">
      <section class="panel">
        <div class="panel-title"><h2>选择口播视频资产</h2><span id="assetCount">读取中…</span></div>
        <div id="assetGrid" class="asset-grid"><div class="state" style="grid-column:1/-1"><strong>正在读取我的口播视频</strong>只显示已经生成完成的数字化 IP 资产</div></div>
      </section>
      <aside class="panel">
        <div class="panel-title"><h2>智能包装预览</h2><span id="styleSummary">AI 自动推荐</span></div>
        <div id="preview" class="preview">
          <div id="previewEmpty" class="preview-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5M8 17h7"/></svg>
            先从左侧选择一条口播视频
          </div>
          <video id="previewVideo" controls playsinline preload="metadata" style="display:none"></video>
          <div id="previewBrand" class="preview-brand" style="display:none"><span>黄雀 AI · 数字化 IP</span><span>自动包装</span></div>
          <div id="previewCard" class="preview-card" style="display:none"></div>
        </div>
        <div id="selectedInfo" class="selected-info"><b>尚未选择素材</b><span>支持最长 180 秒的本人数字化 IP 口播资产</span></div>
        <div class="style-title">选择剪辑风格 <span>版式、颜色和信息节奏会变化</span></div>
        <div id="styleGrid" class="style-grid">
          <button type="button" class="style-option on" data-style="auto">AI 自动推荐</button>
          <button type="button" class="style-option" data-style="content_first">信息科普</button>
          <button type="button" class="style-option" data-style="product_seeding">产品种草</button>
          <button type="button" class="style-option" data-style="promo_fast">快节奏促销</button>
          <button type="button" class="style-option" data-style="brand_premium">高级品牌</button>
          <button type="button" class="style-option" data-style="review_compare">测评对比</button>
          <button type="button" class="style-option" data-style="lifestyle">生活方式</button>
        </div>
        <div class="feature-list"><div class="feature"><b>原声保留</b>不替换声音</div><div class="feature"><b>智能卡片</b>提取口播重点</div><div class="feature"><b>竖屏成片</b>默认 1080P</div></div>
        <button id="generateBtn" class="generate" disabled>选择素材后开始</button>
        <div class="cost">单条固定 <b>30</b> 点 · 失败自动退点 · 按钮显示总价</div>
        <div id="progress" class="progress"><div class="progress-top"><span id="progressText">正在准备</span><span id="progressPercent">8%</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></div>
        <div id="resultActions" class="result-actions"><button id="playResult" class="secondary" type="button">播放成片</button><a id="downloadResult" class="gold" href="#">下载成片</a></div>
      </aside>
    </div>
  </main>
</div></div>
<div id="toast" class="toast"></div>
<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=a5e268bd"></script>
<script>
(function(){
  'use strict';
  var token='__cookie__';
  var assets=[], selected=null, currentJob=0, resumeAssetId='', styleId='auto', resultUrl='', previewObjectUrl='', resultObjectUrl='';
  var $=function(id){return document.getElementById(id);};
  var STYLE_LABELS={auto:'AI 自动推荐',content_first:'信息科普',product_seeding:'产品种草',promo_fast:'快节奏促销',brand_premium:'高级品牌',review_compare:'测评对比',lifestyle:'生活方式'};
  var PHASES={queued:['排队中',8],validating:['正在校验口播视频',16],composing:['正在分析文案并制作包装',32],uploading:['正在上传剪辑工程',48],rendering:['正在云端渲染成片',72],downloading:['正在保存成片',90],qc:['正在检查画面和时长',96],done:['一键剪辑完成',100],failed:['剪辑失败',100]};
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function fresh(u){u=String(u||'');return /^(blob:|data:)/.test(u)||/[?&]q-sign-/.test(u)?u:u+(u.indexOf('?')>=0?'&':'?')+'_='+Date.now();}
  function local(u){return String(u||'').indexOf('/api/gen/file/')===0;}
  function toast(message){var el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2300);}
  function mediaUrl(url){
    if(!local(url)) return Promise.resolve(fresh(url));
    return fetch(url,{headers:{Authorization:'Bearer '+token}}).then(function(r){
      if(r.status===401){location.href='../login.html?redirect=workbench/ai-edit';throw new Error('登录已过期');}
      if(!r.ok) throw new Error('视频读取失败');
      return r.blob();
    }).then(function(blob){return URL.createObjectURL(blob);});
  }
  function duration(seconds){seconds=Math.max(0,Math.round(Number(seconds)||0));return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}
  function dateTime(ts){if(!ts)return '最近生成';var d=new Date(Number(ts)*1000);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
  function selectStyle(next){
    if(currentJob||!STYLE_LABELS[next])return;
    styleId=next;
    document.querySelectorAll('[data-style]').forEach(function(button){button.classList.toggle('on',button.getAttribute('data-style')===styleId);});
    $('styleSummary').textContent=STYLE_LABELS[styleId];
    var mode=document.querySelector('#previewBrand span:last-child');if(mode)mode.textContent=STYLE_LABELS[styleId];
  }
  function lockStyles(locked){document.querySelectorAll('[data-style]').forEach(function(button){button.disabled=!!locked;});}
  function renderAssets(){
    var grid=$('assetGrid');$('assetCount').textContent=assets.length+' 条可用';
    if(!assets.length){grid.innerHTML='<div class="state" style="grid-column:1/-1"><strong>还没有可剪辑的口播视频</strong>请先到「视频生成」完成一条数字化 IP 口播</div>';return;}
    grid.innerHTML=assets.map(function(item){
      var on=selected&&String(selected.id)===String(item.id);
      return '<button type="button" class="asset-card'+(on?' on':'')+'" data-id="'+item.id+'"><div class="asset-cover"><span class="asset-check">✓</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="14" height="14" rx="3"/><path d="M17 10l4-2v8l-4-2zM8 9l5 3-5 3z"/></svg><span class="asset-duration">'+duration(item.duration)+'</span></div><div class="asset-copy"><div class="asset-name">'+esc(item.text||'数字化 IP 口播视频')+'</div><div class="asset-meta"><b>'+esc(item.ratio||'9:16')+'</b><span>·</span><span>'+dateTime(item.created_at)+'</span></div></div></button>';
    }).join('');
    grid.querySelectorAll('[data-id]').forEach(function(card){card.onclick=function(){selectAsset(card.getAttribute('data-id'));};});
  }
  function selectAsset(id){
    selected=assets.find(function(item){return String(item.id)===String(id);})||null;
    renderAssets();
    if(!selected)return;
    $('selectedInfo').innerHTML='<b>'+esc(selected.text||'数字化 IP 口播视频')+'</b><span>'+duration(selected.duration)+' · '+esc(selected.ratio||'9:16')+' · 原声保留</span>';
    $('generateBtn').disabled=!!currentJob;$('generateBtn').textContent=currentJob?'正在继续剪辑…':'一键剪辑 · 30 点';
    $('previewEmpty').style.display='none';$('previewBrand').style.display='flex';$('previewCard').style.display='block';
    $('previewCard').textContent=String(selected.text||'数字化 IP 口播').slice(0,46);
    var video=$('previewVideo');video.style.display='block';video.pause();video.removeAttribute('src');video.load();
    if(previewObjectUrl&&previewObjectUrl.indexOf('blob:')===0)URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl='';
    mediaUrl(selected.video_url).then(function(src){previewObjectUrl=src;video.src=src;video.load();}).catch(function(e){toast(e.message||'预览加载失败');});
  }
  function loadAssets(){
    fetch(fresh('/api/gen/video/assets?limit=120'),{cache:'no-store',headers:{Authorization:'Bearer '+token,'Cache-Control':'no-cache'}})
      .then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/ai-edit';return null;}return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||'资产读取失败');return d;});})
      .then(function(data){if(!data)return;assets=(data.items||[]).filter(function(item){return (item.mode==='text'||item.mode==='audio')&&(item.status==='done'||item.status==='completed'||item.status==='ready')&&item.video_url;});renderAssets();if(resumeAssetId)selectAsset(resumeAssetId);})
      .catch(function(e){$('assetGrid').innerHTML='<div class="state" style="grid-column:1/-1"><strong>口播资产读取失败</strong>刷新页面后重试</div>';$('assetCount').textContent='读取失败';toast(e.message||'资产读取失败');});
  }
  function setProgress(phase,status,error){
    var cfg=PHASES[phase]||PHASES[status]||['正在处理',12];
    $('progress').classList.add('show');$('progressText').textContent=error||cfg[0];$('progressPercent').textContent=cfg[1]+'%';$('progressBar').style.width=cfg[1]+'%';
  }
  function submit(){
    if(!selected||currentJob)return;
    $('generateBtn').disabled=true;$('generateBtn').textContent='正在提交…';$('resultActions').classList.remove('show');setProgress('queued');
    var key='ai-edit-'+selected.id+'-'+Date.now()+'-'+Math.random().toString(16).slice(2);
    lockStyles(true);
    fetch('/api/gen/ai_edit',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({source_video_asset_id:selected.id,style_id:styleId})})
      .then(function(r){return r.json().then(function(d){if(r.status===401){location.href='../login.html?redirect=workbench/ai-edit';return null;}if(!r.ok)throw new Error(d.detail||'提交失败');return d;});})
      .then(function(data){if(!data)return;currentJob=Number(data.job_id);localStorage.setItem('hq_active_ai_edit_job',JSON.stringify({id:currentJob,asset_id:selected.id,style_id:styleId}));if(window.HQ&&HQ.refreshPoints)HQ.refreshPoints();poll();})
      .catch(function(e){currentJob=0;lockStyles(false);$('generateBtn').disabled=false;$('generateBtn').textContent='一键剪辑 · 30 点';setProgress('failed','failed',e.message||'提交失败');toast(e.message||'提交失败');});
  }
  function poll(){
    if(!currentJob)return;
    fetch(fresh('/api/gen/job/'+currentJob),{cache:'no-store',headers:{Authorization:'Bearer '+token}})
      .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||'任务读取失败');return d;});})
      .then(function(job){
        setProgress(job.phase,job.status,job.status==='error'?(job.error||'剪辑失败'):'');
        if(job.status==='done'){
          currentJob=0;localStorage.removeItem('hq_active_ai_edit_job');if(window.HQ&&HQ.refreshPoints)HQ.refreshPoints();
          resultUrl=job.result&&job.result.video_url||'';lockStyles(false);$('generateBtn').disabled=false;$('generateBtn').textContent='再剪一条 · 30 点';$('resultActions').classList.add('show');
          if(resultUrl)showResult(resultUrl,false);loadAssets();toast('一键剪辑完成，成片已保存');return;
        }
        if(job.status==='error'||job.status==='failed'){
          currentJob=0;localStorage.removeItem('hq_active_ai_edit_job');if(window.HQ&&HQ.refreshPoints)HQ.refreshPoints();lockStyles(false);$('generateBtn').disabled=false;$('generateBtn').textContent='重新剪辑 · 30 点';toast(job.error||'剪辑失败，点数已退回');return;
        }
        setTimeout(poll,3000);
      }).catch(function(){setTimeout(poll,4000);});
  }
  function showResult(url,autoplay){
    var video=$('previewVideo');video.pause();video.removeAttribute('src');video.load();
    if(resultObjectUrl&&resultObjectUrl.indexOf('blob:')===0)URL.revokeObjectURL(resultObjectUrl);
    resultObjectUrl='';
    mediaUrl(url).then(function(src){resultObjectUrl=src;video.src=src;video.style.display='block';video.load();if(autoplay)video.play().catch(function(){});});
  }
  function resume(){
    try{var saved=JSON.parse(localStorage.getItem('hq_active_ai_edit_job')||'null');if(!saved||!saved.id)return;resumeAssetId=String(saved.asset_id||'');styleId=STYLE_LABELS[saved.style_id]?saved.style_id:'auto';selectStyle(styleId);currentJob=Number(saved.id);lockStyles(true);$('generateBtn').disabled=true;$('generateBtn').textContent='正在继续剪辑…';setProgress('queued');poll();}catch(e){localStorage.removeItem('hq_active_ai_edit_job');}
  }
  document.querySelectorAll('[data-style]').forEach(function(button){button.onclick=function(){selectStyle(button.getAttribute('data-style'));};});
  $('generateBtn').onclick=submit;
  $('playResult').onclick=function(){if(resultUrl)showResult(resultUrl,true);};
  $('downloadResult').onclick=function(e){e.preventDefault();if(!resultUrl)return;mediaUrl(resultUrl).then(function(src){var a=document.createElement('a');a.href=src;a.download='huangque-ai-edit.mp4';document.body.appendChild(a);a.click();a.remove();});};
  window.addEventListener('beforeunload',function(){if(previewObjectUrl&&previewObjectUrl.indexOf('blob:')===0)URL.revokeObjectURL(previewObjectUrl);if(resultObjectUrl&&resultObjectUrl.indexOf('blob:')===0)URL.revokeObjectURL(resultObjectUrl);});
