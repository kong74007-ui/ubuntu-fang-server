<script>
/* 资产库读真实生成历史（生成即自动入库） */
(function(){
  var tok=localStorage.getItem('hq_token')||''; if(!tok) return;
  var grid=document.getElementById('assetGrid'), empty=document.getElementById('assetEmpty'),
      skelH=document.getElementById('skelHdr'), skelG=document.getElementById('skelGrid'), cnt=document.getElementById('cntWorks');
  var MODE={text2img:'文生图', img2img:'图生图', inpaint:'局部修改'};
  fetch('/api/gen/history?limit=60',{headers:{'Authorization':'Bearer '+tok}}).then(function(r){return r.json();}).then(function(d){
    var it=d.items||[]; if(cnt) cnt.textContent=it.length;
    if(!it.length) return;
    if(empty) empty.style.display='none'; if(skelH) skelH.style.display='none'; if(skelG) skelG.style.display='none';
    grid.style.display='grid';
    grid.innerHTML=it.map(function(x){
      var label=MODE[x.mode]||'作图', p=(x.prompt||'').slice(0,22)||'—';
      return '<div style="position:relative; border:1px solid rgba(148,164,187,.12); border-radius:16px; background:rgba(16,24,39,.4); overflow:hidden;">'
        +'<span style="position:absolute; top:11px; left:11px; z-index:2; padding:3px 9px; font-size:11px; font-weight:600; border-radius:6px; background:rgba(7,11,19,.62); color:#e7b24c;">'+label+'</span>'
        +'<img src="'+x.url+'" loading="lazy" style="display:block; width:100%; aspect-ratio:4/3; object-fit:cover; cursor:pointer;" onclick="window.open(this.src,&quot;_blank&quot;)">'
        +'<div style="padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:8px;"><div style="font-size:12px; color:#94a4bb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+p+'</div><a href="'+x.url+'" download="huangque.png" style="flex:none; font-size:11.5px; color:#e7b24c; text-decoration:none;">下载</a></div>'
        +'</div>';
    }).join('');
  }).catch(function(){});
})();
</script>
