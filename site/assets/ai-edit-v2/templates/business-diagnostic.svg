<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">商业诊断模板预览</title>
  <desc id="desc">深色商业信息图风格，使用暖金强调色、诊断卡片和数据图表。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202d"/>
      <stop offset="1" stop-color="#080c13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d78b"/>
      <stop offset="1" stop-color="#c98b2f"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <rect width="900" height="1600" fill="url(#grid)"/>
  <circle cx="795" cy="132" r="190" fill="#d9a44a" fill-opacity=".08"/>
  <rect x="70" y="82" width="278" height="56" rx="28" fill="#d9a44a" fill-opacity=".16" stroke="#e8bd68" stroke-opacity=".7"/>
  <text x="105" y="120" fill="#f0cc7c" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">BUSINESS 01</text>
  <text x="70" y="260" fill="#f6f2e9" font-family="Arial, sans-serif" font-size="82" font-weight="800">商业诊断</text>
  <text x="72" y="320" fill="#98a4b5" font-family="Arial, sans-serif" font-size="28" letter-spacing="3">看见问题 · 找到证据 · 给出方案</text>
  <rect x="70" y="395" width="760" height="390" rx="34" fill="#121a26" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
  <text x="112" y="468" fill="#b1bbc8" font-family="Arial, sans-serif" font-size="25">核心指标</text>
  <text x="112" y="575" fill="url(#gold)" font-family="Arial, sans-serif" font-size="112" font-weight="800">68%</text>
  <text x="112" y="626" fill="#e8edf4" font-family="Arial, sans-serif" font-size="28">关键问题已被识别</text>
  <path d="M112 716 C230 650 292 704 390 618 S580 570 788 482" fill="none" stroke="#e5b75c" stroke-width="12" stroke-linecap="round"/>
  <g fill="#e5b75c">
    <circle cx="112" cy="716" r="12"/><circle cx="390" cy="618" r="12"/><circle cx="788" cy="482" r="12"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="835" width="760" height="154" rx="26" fill="#f2cc79"/>
    <text x="108" y="898" fill="#2d220e" font-size="25" font-weight="700">01 / 问题</text>
    <text x="108" y="954" fill="#18140c" font-size="38" font-weight="800">先把复杂问题说清楚</text>
    <rect x="70" y="1022" width="760" height="154" rx="26" fill="#151e2b" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="108" y="1085" fill="#d7a94f" font-size="25" font-weight="700">02 / 证据</text>
    <text x="108" y="1141" fill="#f4f6f8" font-size="38" font-weight="800">用数据支撑每个判断</text>
    <rect x="70" y="1209" width="760" height="154" rx="26" fill="#151e2b" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="108" y="1272" fill="#d7a94f" font-size="25" font-weight="700">03 / 方案</text>
    <text x="108" y="1328" fill="#f4f6f8" font-size="38" font-weight="800">让行动建议一眼可见</text>
    <text x="70" y="1510" fill="#7e8a9b" font-size="23" letter-spacing="4">EDITORIAL BUSINESS SYSTEM</text>
  </g>
</svg>
