<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">现代纪实模板预览</title>
  <desc id="desc">中性纪实风格，使用冷青强调色、时间地点标签和克制字幕。</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6b6c"/>
      <stop offset=".42" stop-color="#273738"/>
      <stop offset="1" stop-color="#0a1113"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8e0dc" stop-opacity=".3"/>
      <stop offset="1" stop-color="#5ac7c0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="#0a1012"/>
  <rect width="900" height="1090" fill="url(#scene)"/>
  <circle cx="690" cy="350" r="240" fill="url(#mist)"/>
