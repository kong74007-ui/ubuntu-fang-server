    <div style="position:relative; width:100%; max-width:424px; padding:38px 38px 32px; border:1px solid rgba(231,178,76,.2); border-radius:24px; background:linear-gradient(165deg, rgba(28,23,13,.5), rgba(12,16,26,.42)); backdrop-filter:blur(26px) saturate(1.2); -webkit-backdrop-filter:blur(26px) saturate(1.2); box-shadow:0 40px 100px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(231,178,76,.05), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 30px rgba(231,178,76,.04);">

      <div style="display:flex; gap:28px; margin-top:26px; border-bottom:1px solid rgba(148,164,187,.1);">
        <div id="tabPhone" style="padding:11px 2px; font-size:14.5px; font-weight:600; cursor:pointer; white-space:nowrap; border-bottom:2px solid #e7b24c; color:#eaf1fa; margin-bottom:-1px; transition:.18s;">手机号登录</div>

          <span style="display:flex; width:17px; color:#5c6b82;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
          <input id="username" placeholder="请输入手机号 / 账号" style="flex:1; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:14px; font-family:inherit;">
        </div>
        <div id="rowPhone" style="display:flex; gap:10px;">

            <span style="display:flex; width:17px; color:#5c6b82;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></span>
            <input id="code" placeholder="请输入验证码" style="flex:1; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:14px; font-family:inherit;">

          <button type="button" id="getCode" style="flex:none; padding:0 15px; height:48px; white-space:nowrap; font-size:13px; color:#e7b24c; background:rgba(231,178,76,.08); border:1px solid rgba(231,178,76,.28); border-radius:12px; cursor:pointer; font-family:inherit; transition:.18s;">获取验证码</button>
        </div>
        <div id="rowPwd" style="display:none; align-items:center; gap:11px; padding:0 15px; height:48px; border:1px solid rgba(148,164,187,.16); background:rgba(7,11,19,.5); border-radius:12px;">
          <span style="display:flex; width:17px; color:#5c6b82;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></span>

      <div id="msg" style="text-align:center; font-size:12.5px; margin-top:12px; min-height:16px; color:#f4708a;"></div>
      <div style="display:flex; align-items:center; gap:14px; margin:16px 0 16px; color:#5c6b82; font-size:12px;"><div style="flex:1; height:1px; background:rgba(148,164,187,.12);"></div>或<div style="flex:1; height:1px; background:rgba(148,164,187,.12);"></div></div>

<script src="assets/cloud.js"></script>
<script>
(function(){
  "use strict";
  var phone=true, remember=false;
  var tabPhone=document.getElementById("tabPhone"), tabPwd=document.getElementById("tabPwd");
  var rowPhone=document.getElementById("rowPhone"), rowPwd=document.getElementById("rowPwd");
  var msg=document.getElementById("msg"), btn=document.getElementById("submitBtn");
  function setMsg(t,kind){ msg.textContent=t||""; msg.style.color=(kind==="ok")?"#2bd576":(kind==="err"?"#f4708a":"#94a4bb"); }
  function setTab(p){
    phone=p;
    tabPhone.style.borderBottomColor=p?"#e7b24c":"transparent"; tabPhone.style.color=p?"#eaf1fa":"#94a4bb";
    tabPwd.style.borderBottomColor=p?"transparent":"#e7b24c"; tabPwd.style.color=p?"#94a4bb":"#eaf1fa";
    rowPhone.style.display=p?"flex":"none"; rowPwd.style.display=p?"none":"flex";
  }
  tabPhone.onclick=function(){setTab(true);}; tabPwd.onclick=function(){setTab(false);};
  document.getElementById("remember").onclick=function(){
    remember=!remember;
    document.getElementById("rememberBox").style.background=remember?"#e7b24c":"transparent";
    document.getElementById("rememberBox").style.borderColor=remember?"#e7b24c":"rgba(148,164,187,.3)";
    document.getElementById("rememberMark").style.opacity=remember?"1":"0";
  };
  document.getElementById("getCode").onclick=function(){ setMsg("验证码登录即将上线，请用密码登录","err"); };

  function doLogin(){
    var username=(document.getElementById("username").value||"").trim();
    var secret=phone ? (document.getElementById("code").value||"") : (document.getElementById("password").value||"");
    if(!username||!secret){ setMsg(phone?"请填写账号和验证码":"请填写账号和密码","err"); return; }
    btn.disabled=true; btn.style.opacity=".7"; setMsg("登录中…");
    fetch("/api/auth/login",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:username,password:secret})
    }).then(function(r){
      if(r.status===404){ throw new Error("__nobackend__"); }
      return r.json().then(function(d){ return {ok:r.ok,d:d}; });
    }).then(function(res){
      if(res.ok && res.d && res.d.token){
        try{ localStorage.setItem("hq_token",res.d.token); if(res.d.user) localStorage.setItem("hq_user",JSON.stringify(res.d.user)); }catch(e){}
        setMsg("登录成功，正在进入…","ok");
        var rd=new URLSearchParams(location.search).get("redirect");
        var dest=(rd && /^[a-zA-Z0-9_-]+$/.test(rd)) ? rd : "dashboard";
        location.href="workbench/"+dest+".html";
      }else{
        btn.disabled=false; btn.style.opacity="1"; setMsg((res.d&&res.d.detail)||"账号或密码错误","err");
      }
    }).catch(function(err){
      btn.disabled=false; btn.style.opacity="1";
      if(err&&err.message==="__nobackend__"){ setMsg("登录服务即将上线（账号体系开发中）","err"); }
      else{ setMsg("网络错误，请重试","err"); }
    });
  }
  btn.onclick=doLogin;
  document.getElementById("teamLogin").onclick=doLogin;
  [["username","code","password"]].forEach(function(){});
  ["username","code","password"].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  });
})();
</script>
