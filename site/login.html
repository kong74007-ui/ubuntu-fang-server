<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 黄雀 AI 工作台</title>
<link rel="icon" href="assets/cloud/logo-bird.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cloud.css?v=8">
<style>
  /* ── Grid ── */
  .gLogin{ grid-template-columns:1.05fr .95fr; }

  /* ── Brand panel base ── */
  .brand-panel{
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    padding:clamp(28px,5vh,64px) clamp(28px,5vw,72px);
    min-height:100vh;
  }

  /* Ambient texture: 纯金色渐变底纹（无任何烤死文字，避免鬼影） */
  .brand-panel::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(90% 60% at 18% 28%, rgba(231,178,76,.07), transparent 62%),
      radial-gradient(70% 50% at 85% 88%, rgba(231,178,76,.05), transparent 60%);
    pointer-events:none;
  }

  /* Gold glow blob */
  .brand-panel::after{
    content:"";
    position:absolute; top:25%; left:-10%; width:80%; height:60%;
    background:radial-gradient(ellipse at 40% 50%, rgba(231,178,76,.13) 0%, rgba(231,178,76,.04) 50%, transparent 75%);
    pointer-events:none;
  }

  /* Feature item row */
  .bp-feature{
    display:flex; align-items:center; gap:clamp(10px,1.4vw,16px);
    padding:clamp(11px,1.4vh,15px) clamp(14px,1.6vw,18px);
    border:1px solid rgba(231,178,76,.12);
    border-radius:12px;
    background:rgba(231,178,76,.04);
    transition:.16s;
  }
  .bp-feature:hover{
    background:rgba(231,178,76,.08);
    border-color:rgba(231,178,76,.22);
  }
  .bp-icon{
    flex:none; display:flex; align-items:center; justify-content:center;
    width:clamp(30px,3.2vw,38px); height:clamp(30px,3.2vw,38px);
    border-radius:9px;
    background:rgba(231,178,76,.1);
    color:#e7b24c;
  }
  .bp-icon svg{ width:clamp(14px,1.5vw,17px); height:clamp(14px,1.5vw,17px); }
  .bp-label{ font-size:clamp(13px,1.1vw,14.5px); font-weight:600; color:#eaf1fa; line-height:1.25; }
  .bp-desc{ font-size:clamp(11px,.9vw,12.5px); color:#5c6b82; margin-top:2px; }

  /* ── Narrow: brand panel becomes compact top strip ── */
  @media (max-width:900px){
    .gLogin{ grid-template-columns:1fr !important; }
    .login-right{ margin-left:0 !important; }

    .brand-panel{
      min-height:0;
      flex-direction:row; align-items:center;
      padding:16px 24px;
      gap:16px;
    }
    .brand-panel::before{ opacity:.06; }
    .bp-features{ display:none !important; }
    .bp-headline{ font-size:15px !important; letter-spacing:0 !important; }
    .bp-sub{ display:none !important; }
    .bp-logo{ height:28px !important; margin-bottom:0 !important; margin-right:16px; }
    .bp-content{ flex-direction:row !important; align-items:center !important; gap:0 !important; }
    .bp-deco{ display:none !important; }
    .bp-divider{ display:none !important; }
  }

  @media (max-width:600px){
    .brand-panel{ padding:12px 16px; }
    .bp-headline{ font-size:13px !important; }
    .bp-logo{ height:22px !important; }
  }
</style>
</head>
<body style="overflow:hidden;">

<div class="gLogin" style="position:relative; z-index:1; min-height:100vh; display:grid; overflow:hidden;">

    <div style="position:absolute; left:-22%; top:0; bottom:0; width:70%; background:radial-gradient(60% 75% at 30% 62%, rgba(231,178,76,.16), rgba(231,178,76,.05) 46%, transparent 74%); pointer-events:none;"></div>
    <div style="position:absolute; right:-8%; top:50%; transform:translateY(-50%); width:860px; height:860px; background:radial-gradient(circle, rgba(231,178,76,.16), rgba(231,178,76,.05) 38%, transparent 66%); pointer-events:none;"></div>
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" style="position:absolute; right:-16%; top:50%; transform:translateY(-50%); width:1060px; height:1060px; pointer-events:none;">

          <span style="display:flex; width:17px; color:#5c6b82;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
          <input id="username" placeholder="请输入手机号 / 账号" style="flex:1; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:14px; font-family:inherit;">

        <div id="rowPhone" style="display:flex; gap:10px;">

            <span style="display:flex; width:17px; color:#5c6b82;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></span>
            <input id="code" placeholder="请输入验证码" style="flex:1; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:14px; font-family:inherit;">

        </div>

      <div id="msg" style="text-align:center; font-size:12.5px; margin-top:12px; min-height:16px; color:#f4708a;"></div>
      <div style="display:flex; align-items:center; gap:14px; margin:16px 0 16px; color:#5c6b82; font-size:12px;"><div style="flex:1; height:1px; background:rgba(148,164,187,.12);"></div>或<div style="flex:1; height:1px; background:rgba(148,164,187,.12);"></div></div>
      <div id="teamLogin" style="text-align:center; font-size:14px; color:#2dd4bf; cursor:pointer; font-weight:500;">团队口令登录 →</div>
      <div style="text-align:center; font-size:11.5px; color:#5c6b82; margin-top:18px;">登录即代表您同意 <span style="color:#94a4bb;">《用户协议》</span> 与 <span style="color:#94a4bb;">《隐私政策》</span></div>

<script src="assets/cloud.js?v=8"></script>
<script>
(function(){
  "use strict";
  var phone=true, remember=false;
  var tabPhone=document.getElementById("tabPhone"), tabPwd=document.getElementById("tabPwd");
  var rowPhone=document.getElementById("rowPhone"), rowPwd=document.getElementById("rowPwd");
  var msg=document.getElementById("msg"), btn=document.getElementById("submitBtn");
  function setMsg(t,kind){ msg.textContent=t||""; msg.style.color=(kind==="ok")?"#2bd576":(kind==="err"?"#f4708a":"#94a4bb"); }
  function setTab(p){
    phone=p;
    tabPhone.style.borderBottomColor=p?"#e7b24c":"transparent"; tabPhone.style.color=p?"#eaf1fa":"#94a4bb";
    tabPwd.style.borderBottomColor=p?"transparent":"#e7b24c"; tabPwd.style.color=p?"#94a4bb":"#eaf1fa";
    rowPhone.style.display=p?"flex":"none"; rowPwd.style.display=p?"none":"flex";
  }
  tabPhone.onclick=function(){setTab(true);}; tabPwd.onclick=function(){setTab(false);};
  document.getElementById("remember").onclick=function(){
    remember=!remember;
    document.getElementById("rememberBox").style.background=remember?"#e7b24c":"transparent";
    document.getElementById("rememberBox").style.borderColor=remember?"#e7b24c":"rgba(148,164,187,.3)";
    document.getElementById("rememberMark").style.opacity=remember?"1":"0";
  };
  document.getElementById("getCode").onclick=function(){ setMsg("验证码登录即将上线，请用密码登录","err"); };

  function doLogin(){
    var username=(document.getElementById("username").value||"").trim();
    var secret=phone ? (document.getElementById("code").value||"") : (document.getElementById("password").value||"");
    if(!username||!secret){ setMsg(phone?"请填写账号和验证码":"请填写账号和密码","err"); return; }
    btn.disabled=true; btn.style.opacity=".7"; setMsg("登录中…");
    fetch("/api/auth/login",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:username,password:secret})
    }).then(function(r){
      if(r.status===404){ throw new Error("__nobackend__"); }
      return r.json().then(function(d){ return {ok:r.ok,d:d}; });
    }).then(function(res){
      if(res.ok && res.d && res.d.token){
        try{ localStorage.removeItem("hq_role"); localStorage.setItem("hq_token",res.d.token); if(res.d.user) localStorage.setItem("hq_user",JSON.stringify(res.d.user)); }catch(e){}
        setMsg("登录成功，正在进入…","ok");
        var role=(res.d.user && res.d.user.role) || "member";
        var rd=new URLSearchParams(location.search).get("redirect");
        var dest=(rd && /^[a-zA-Z0-9_-]+$/.test(rd)) ? rd : (role==="admin" ? "dashboard" : "inspiration");
        location.href="workbench/"+dest+".html";
      }else{
        btn.disabled=false; btn.style.opacity="1"; setMsg((res.d&&res.d.detail)||"账号或密码错误","err");
      }
    }).catch(function(err){
      btn.disabled=false; btn.style.opacity="1";
      if(err&&err.message==="__nobackend__"){ setMsg("登录服务即将上线（账号体系开发中）","err"); }
      else{ setMsg("网络错误，请重试","err"); }
    });
  }
  btn.onclick=doLogin;
  document.getElementById("teamLogin").onclick=doLogin;
  [["username","code","password"]].forEach(function(){});
  ["username","code","password"].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  });
})();
</script>
</body>
</html>
