<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 黄雀 AI 工作台</title>
<link rel="icon" href="assets/cloud/logo-bird.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080a; --ink:#f4f5f7; --mut:#9a9ba2; --faint:#67686e;
    --gold:#e7b24c; --gold2:#f4cd72; --line:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* 单一柔和电影感环境光 + 暗角，无粒子/光环/霓虹 */
  .amb{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .amb::before{content:""; position:absolute; left:24%; top:38%; width:48vw; height:48vw;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(231,178,76,.11), rgba(231,178,76,.028) 40%, transparent 66%);}
  .amb::after{content:""; position:absolute; inset:0;
    background:radial-gradient(135% 120% at 50% 46%, transparent 52%, rgba(0,0,0,.6) 100%);}

  .wrap{position:relative; z-index:1; height:100%; display:grid; grid-template-columns:1.05fr .95fr;}

  /* ===== 左 · 品牌（黄雀为中心） ===== */
  .brand{display:flex; flex-direction:column; justify-content:center;
    padding:clamp(44px,6vw,96px); gap:clamp(18px,2.6vh,30px);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;}
  .spark{width:clamp(104px,9.5vw,150px); height:auto; align-self:flex-start;
    filter:drop-shadow(0 10px 38px rgba(231,178,76,.42));}
  .word{font-size:clamp(32px,3.6vw,50px); font-weight:200; letter-spacing:.02em; line-height:1.08;}
  .word b{font-weight:600;}
  .tag{font-size:clamp(13px,1.05vw,15px); color:var(--mut); letter-spacing:.16em; font-weight:300;}
  .stats{display:flex; gap:clamp(24px,2.8vw,48px); margin-top:clamp(12px,2.4vh,24px);}
  .stat .n{font-size:clamp(22px,2.2vw,30px); font-weight:600; color:var(--gold2);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1;}
  .stat .l{font-size:11.5px; color:var(--faint); letter-spacing:.12em; margin-top:8px;}

  /* ===== 右 · 玻璃浮层登录卡 ===== */
  .auth{display:flex; align-items:center; justify-content:center;
    padding:clamp(24px,4vw,56px); animation:rise .8s .1s cubic-bezier(.2,.7,.2,1) both;}
  .glass{width:100%; max-width:396px; padding:clamp(30px,3vw,44px); border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.018));
    border:1px solid var(--line);
    box-shadow:0 40px 90px -34px rgba(0,0,0,.85),
               0 1px 0 rgba(255,255,255,.06) inset,
               0 -50px 70px -56px rgba(231,178,76,.22) inset;
    backdrop-filter:blur(34px) saturate(1.25); -webkit-backdrop-filter:blur(34px) saturate(1.25);}
  .h1{font-size:22px; font-weight:600; letter-spacing:.01em;}
  .sub{font-size:13px; color:var(--mut); margin-top:9px; line-height:1.6;}
  .tabs{display:flex; gap:26px; margin-top:28px; border-bottom:1px solid var(--line);}
  .tab{padding:11px 1px; font-size:14px; font-weight:500; cursor:pointer;
    color:var(--mut); border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .22s, border-color .22s;}
  .flds{margin-top:22px; display:flex; flex-direction:column; gap:13px;}
  .fld{display:flex; align-items:center; gap:12px; height:50px; padding:0 16px;
    border:1px solid var(--line); background:rgba(0,0,0,.24); border-radius:14px;
    transition:border-color .2s, box-shadow .2s, background .2s;}
  .fld:focus-within{border-color:rgba(231,178,76,.5); background:rgba(0,0,0,.34);
    box-shadow:0 0 0 3px rgba(231,178,76,.12);}
  .fld input{flex:1; background:transparent; border:0; outline:0; color:var(--ink);
    font-size:14px; font-family:inherit;}
  .fld input::placeholder{color:var(--faint);}
  .ic{width:17px; height:17px; color:var(--faint); display:flex; flex:none; transition:color .2s;}
  .fld:focus-within .ic{color:var(--gold);}
  .codebtn{height:50px; padding:0 16px; white-space:nowrap; font-size:13px; color:var(--gold);
    background:rgba(231,178,76,.08); border:1px solid rgba(231,178,76,.26); border-radius:14px;
    cursor:pointer; font-family:inherit; transition:.18s;}
  .codebtn:hover{background:rgba(231,178,76,.15); border-color:rgba(231,178,76,.4);}
  .row{display:flex; align-items:center; justify-content:space-between; margin-top:18px; font-size:13px;}
  .ck{display:flex; align-items:center; gap:8px; color:var(--mut); cursor:pointer;}
  .ckbox{width:16px; height:16px; border-radius:5px; border:1.5px solid rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; color:#1c1402; transition:.16s;}
  .btnp{width:100%; height:50px; margin-top:22px; border:0; border-radius:14px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; letter-spacing:.2em; color:#1c1402;
    background:linear-gradient(135deg,#f6d488,#e7b24c);
    box-shadow:0 16px 32px -14px rgba(231,178,76,.6);
    transition:transform .18s, box-shadow .18s, filter .18s;}
  .btnp:hover{transform:translateY(-1px); box-shadow:0 20px 42px -14px rgba(231,178,76,.78); filter:brightness(1.05);}
  .btnp:active{transform:translateY(0); filter:brightness(.98);}
  .sep{display:flex; align-items:center; gap:14px; margin:18px 0; color:var(--faint); font-size:12px;}
  .sep i{flex:1; height:1px; background:var(--line);}
  .team{text-align:center; font-size:14px; color:var(--gold); cursor:pointer; font-weight:500; transition:color .18s;}
  .team:hover{color:var(--gold2);}
  .terms{text-align:center; font-size:11.5px; color:var(--faint); margin-top:18px;}
  .lnk{color:var(--mut); cursor:pointer; transition:color .18s;}
  .lnk:hover{color:var(--ink);}

  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}

  /* 自适应：窄屏堆叠，品牌收上方，登录卡在下，整页可滚 */
  @media (max-width:920px){
    body{overflow:auto;}
    .wrap{grid-template-columns:1fr; min-height:100%;}
    .brand{padding:52px 30px 6px; gap:16px;}
    .spark{width:80px;}
    .word{font-size:34px;}
    .stats{flex-wrap:wrap; gap:24px 30px;}
    .auth{padding:22px 24px 52px;}
  }
  @media (max-width:520px){
    .brand{padding:40px 22px 4px;}
    .word{font-size:30px;} .stat .n{font-size:22px;}
    .glass{padding:28px 22px;}
  }
  @media (prefers-reduced-motion:reduce){ .brand,.auth{animation:none;} }
</style>
</head>
<body>
<div class="amb"></div>

<div class="wrap">
  <!-- ===== 左 · 品牌（黄雀为唯一中心） ===== -->
  <section class="brand">
    <a href="workbench/inspiration.html" title="进入工作台" style="line-height:0; text-decoration:none;">
      <img class="spark" src="assets/cloud/logo-bird.png" alt="黄雀 AI">
    </a>
    <div class="word">黄雀 <b>AI</b></div>
    <div class="tag">评论区获客 · AI 内容成交</div>
    <div class="stats">
      <div class="stat"><div class="n cu-num" data-target="1770" data-suffix="+">0+</div><div class="l">评论采集</div></div>
      <div class="stat"><div class="n cu-num" data-target="3168" data-suffix="+">0+</div><div class="l">账号线索</div></div>
      <div class="stat"><div class="n cu-num" data-target="100" data-suffix="+">0+</div><div class="l">精准客户</div></div>
      <div class="stat"><div class="n cu-num" data-target="80" data-suffix="%">0%</div><div class="l">回复率提升</div></div>
    </div>
  </section>

  <!-- ===== 右 · 玻璃浮层登录卡 ===== -->
  <section class="auth">
    <div class="glass">
      <div class="h1">欢迎回来</div>
      <div class="sub">登录黄雀 AI 工作台，开启智能获客与内容创作</div>

      <div class="tabs">
        <div id="tabPhone" class="tab" style="color:var(--ink); border-bottom-color:var(--gold);">手机号登录</div>
        <div id="tabPwd" class="tab">密码登录</div>
      </div>

      <div class="flds">
        <div class="fld">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
          <input id="username" placeholder="请输入手机号 / 账号">
        </div>
        <div id="rowPhone" style="display:flex; gap:10px;">
          <div class="fld" style="flex:1;">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></span>
            <input id="code" placeholder="请输入验证码">
          </div>
          <button type="button" id="getCode" class="codebtn">获取验证码</button>
        </div>
        <div id="rowPwd" class="fld" style="display:none;">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          <input id="password" type="password" placeholder="请输入密码">
        </div>
      </div>

      <div class="row">
        <label id="remember" class="ck">
          <span id="rememberBox" class="ckbox"><span id="rememberMark" style="display:flex; width:11px; opacity:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M20 6L9 17l-5-5"/></svg></span></span>记住我
        </label>
        <a class="lnk">忘记密码？</a>
      </div>

      <button type="button" id="submitBtn" class="btnp">登 录</button>
      <div id="msg" style="text-align:center; font-size:12.5px; margin-top:12px; min-height:16px; color:#f4708a;"></div>

      <div class="sep"><i></i>或<i></i></div>
      <div id="teamLogin" class="team">团队口令登录 →</div>
      <div class="terms">登录即代表您同意 <span class="lnk">《用户协议》</span> 与 <span class="lnk">《隐私政策》</span></div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var phone=true, remember=false;
  var tabPhone=document.getElementById("tabPhone"), tabPwd=document.getElementById("tabPwd");
  var rowPhone=document.getElementById("rowPhone"), rowPwd=document.getElementById("rowPwd");
  var msg=document.getElementById("msg"), btn=document.getElementById("submitBtn");
  function setMsg(t,kind){ msg.textContent=t||""; msg.style.color=(kind==="ok")?"#2bd576":(kind==="err"?"#f4708a":"#9a9ba2"); }
  function setTab(p){
    phone=p;
    tabPhone.style.borderBottomColor=p?"#e7b24c":"transparent"; tabPhone.style.color=p?"#f4f5f7":"#9a9ba2";
    tabPwd.style.borderBottomColor=p?"transparent":"#e7b24c"; tabPwd.style.color=p?"#9a9ba2":"#f4f5f7";
    rowPhone.style.display=p?"flex":"none"; rowPwd.style.display=p?"none":"flex";
  }
  tabPhone.onclick=function(){setTab(true);}; tabPwd.onclick=function(){setTab(false);};
  document.getElementById("remember").onclick=function(){
    remember=!remember;
    document.getElementById("rememberBox").style.background=remember?"#e7b24c":"transparent";
    document.getElementById("rememberBox").style.borderColor=remember?"#e7b24c":"rgba(255,255,255,.22)";
    document.getElementById("rememberMark").style.opacity=remember?"1":"0";
  };
  document.getElementById("getCode").onclick=function(){ setMsg("验证码登录即将上线，请用密码登录","err"); };

  function doLogin(){
    var username=(document.getElementById("username").value||"").trim();
    var secret=phone ? (document.getElementById("code").value||"") : (document.getElementById("password").value||"");
    if(!username||!secret){ setMsg(phone?"请填写账号和验证码":"请填写账号和密码","err"); return; }
    btn.disabled=true; btn.style.opacity=".7"; setMsg("登录中…");
    fetch("/api/auth/login",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:username,password:secret})
    }).then(function(r){
      if(r.status===404){ throw new Error("__nobackend__"); }
      return r.json().then(function(d){ return {ok:r.ok,d:d}; });
    }).then(function(res){
      if(res.ok && res.d && res.d.token){
        try{ localStorage.removeItem("hq_role"); localStorage.setItem("hq_token",res.d.token); if(res.d.user) localStorage.setItem("hq_user",JSON.stringify(res.d.user)); }catch(e){}
        setMsg("登录成功，正在进入…","ok");
        var role=(res.d.user && res.d.user.role) || "member";
        var rd=new URLSearchParams(location.search).get("redirect");
        var dest=(rd && /^[a-zA-Z0-9_-]+$/.test(rd)) ? rd : (role==="admin" ? "dashboard" : "inspiration");
        location.href="workbench/"+dest+".html";
      }else{
        btn.disabled=false; btn.style.opacity="1"; setMsg((res.d&&res.d.detail)||"账号或密码错误","err");
      }
    }).catch(function(err){
      btn.disabled=false; btn.style.opacity="1";
      if(err&&err.message==="__nobackend__"){ setMsg("登录服务即将上线（账号体系开发中）","err"); }
      else{ setMsg("网络错误，请重试","err"); }
    });
  }
  btn.onclick=doLogin;
  document.getElementById("teamLogin").onclick=doLogin;
  ["username","code","password"].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  });

  // 数字递增动画：加载时从 0 平滑涨到目标（ease-out，一次性，跑完即停）
  (function(){
    var els=document.querySelectorAll(".cu-num");
    if(!els.length) return;
    function fmt(n,suffix){ return n.toLocaleString("en")+suffix; }
    function run(el){
      var target=parseInt(el.dataset.target,10)||0, suffix=el.dataset.suffix||"", dur=1400, t0=performance.now();
      (function step(now){
        var p=Math.min((now-t0)/dur,1), eased=1-Math.pow(1-p,3);
        el.textContent=fmt(Math.round(eased*target),suffix);
        if(p<1) requestAnimationFrame(step);
      })(t0);
    }
    els.forEach(run);
  })();
})();
</script>
</body>
</html>
