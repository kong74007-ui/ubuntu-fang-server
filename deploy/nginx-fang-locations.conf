# Backend-only Pixelle bridge. The public website never calls this route
# directly; only the production content service may reach the isolated API.
location ^~ /internal/pixelle/ {
    allow 129.204.166.13;
    deny all;

    proxy_pass http://127.0.0.1:8103/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 8s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
}

