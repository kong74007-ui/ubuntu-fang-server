# Webhook token lives in the query string. Disable nginx access logging for this
# path so neither the token nor other query arguments are persisted.
location ^~ /api/v2/edit/webhooks/ {
    access_log off;
    proxy_pass http://127.0.0.1:8096;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 8s;
    proxy_read_timeout 30s;
}

