# Test website and mini-program API entrypoint.
server {
    listen 80;
    listen [::]:80;
    server_name fang.huangquechuanmei.com;

    # Keep HTTP-01 available for unattended certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fang.huangquechuanmei.com;

    ssl_certificate /etc/letsencrypt/live/fang.huangquechuanmei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fang.huangquechuanmei.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FANG_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/html;
    index index.html;
    charset utf-8;
    client_max_body_size 80m;

    access_log /var/log/nginx/fang.access.log;
    error_log /var/log/nginx/fang.error.log;

    include /etc/nginx/snippets/fang-app-locations.conf;
}
