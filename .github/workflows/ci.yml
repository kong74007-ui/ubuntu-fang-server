name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码与安全门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            design-system/package-lock.json
            server/ai_edit_v3_renderer/package-lock.json

      - name: 安装微信消息推送加密依赖
        run: python -m pip install "cryptography>=41,<50"

      - name: 安装 AI Edit V3 Python 依赖
        run: python -m pip install --disable-pip-version-check --no-input --no-deps --requirement deploy/requirements-ai-edit-v3.txt

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check --no-input --requirement deploy/requirements-test.txt

      - name: Install FFmpeg for media contract tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 检查敏感文件与静态资源
        run: python scripts/ci_validate.py

      - name: Verify workbench shell cache stamps
        run: python scripts/stamp_assets.py --check

      - name: 测试 CI 检查器
        run: python -m unittest discover -s tests -v

      - name: Test Pixelle talking material workflow
        run: >-
          python -m pytest -q
          tests/test_pixelle_talking_bridge.py
          tests/test_pixelle_talking_client.py
          tests/test_pixelle_talking_integration.py
          tests/test_pixelle_talking_runtime.py

      - name: 检查 Python 语法
        shell: bash
        run: |
          mapfile -d '' files < <(find server scripts worker -type f -name '*.py' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files found under server/, scripts/, or worker/."
            exit 0
          fi
          python -m py_compile "${files[@]}"

      - name: 检查 JavaScript 语法
        run: find site -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: 测试全部工作台 JavaScript
        run: node --test tests/*.js

      - name: 安装 AI Edit V3 renderer 依赖
        working-directory: server/ai_edit_v3_renderer
        run: npm ci

      - name: 测试 AI Edit V3 renderer
        working-directory: server/ai_edit_v3_renderer
        run: npm test

      - name: 校验 AI Edit V3 renderer release lock
        working-directory: server/ai_edit_v3_renderer
        run: npm run release:lock:check

      - name: 安装设计系统依赖
        working-directory: design-system
        run: npm ci

      - name: 构建设计系统
        working-directory: design-system
        run: npm run build

  sqlite-native-identity:
    name: SQLite native identity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AI Edit V3 dependencies
        run: python -m pip install --disable-pip-version-check --no-input --no-deps --requirement deploy/requirements-ai-edit-v3.txt

      - name: Verify real Unix VFS identity and migration concurrency
        run: >-
          python -m unittest -v
          tests.test_ai_edit_v3_store.V3StoreNativeGuardReleaseTests.test_linux_real_native_probe_isolated_in_subprocess
          tests.test_ai_edit_v3_store.V3StoreNativeGuardReleaseTests.test_linux_sqlite_symbol_interposition_fails_before_sqlite_connect
          tests.test_ai_edit_v3_store.V3StoreMigrationRaceTests.test_fresh_database_8_threads_50_rounds
          tests.test_ai_edit_v3_store.V3StoreMigrationRaceTests.test_native_delete_v0_database_8_threads_50_rounds
          tests.test_ai_edit_v3_store.V3StoreMigrationRaceTests.test_existing_wal_v0_database_8_threads_50_rounds
